<!DOCTYPE html>
<html lang="no">
<head>
<meta charset="utf-8">
<meta name="robots" content="noindex, nofollow">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Bollerina – bestillinger (demo)</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:opsz,wght@6..96,600&family=Jost:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#FBF1EC; --paper:#FFFAF7; --blush:#F6DCE2; --rose:#C8325F; --rose-ink:#fff;
  --wine:#5A1A2C; --ink:#2E1419; --muted:#7A585E; --line:#EBD2D5;
  --ok:#2F7A55; --ok-bg:#DDF1E6; --new-bg:#FBE0E8; --done-bg:#ECE6E6;
  --serif:"Bodoni Moda","Didot","Bodoni 72",Georgia,serif;
  --sans:Jost,"Avenir Next",system-ui,-apple-system,"Segoe UI",sans-serif;
  box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#1D0B11;--paper:#28121A;--blush:#41202A;--rose:#EE6D93;--rose-ink:#1D0B11;--wine:#5E1C30;--ink:#F8E7E9;--muted:#C9A7AE;--line:#46262F;
  --ok:#7FD3A7;--ok-bg:#1E3A2C;--new-bg:#4A1F2C;--done-bg:#33252A;}}
:root[data-theme="dark"]{--bg:#1D0B11;--paper:#28121A;--blush:#41202A;--rose:#EE6D93;--rose-ink:#1D0B11;--wine:#5E1C30;--ink:#F8E7E9;--muted:#C9A7AE;--line:#46262F;
  --ok:#7FD3A7;--ok-bg:#1E3A2C;--new-bg:#4A1F2C;--done-bg:#33252A;}
*,*::before,*::after{box-sizing:border-box}
html{height:auto}
body{margin:0;background:var(--bg);color:var(--ink);font:400 1rem/1.5 var(--sans)}
button{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--rose);outline-offset:2px;border-radius:8px}
.app{max-width:760px;margin:0 auto;padding:0 16px 100px}
.demo{background:var(--wine);color:#FBE6EA;text-align:center;font-size:.85rem;padding:8px 14px}
.demo a{color:#fff}
.top{display:flex;align-items:center;gap:12px;padding:20px 0 6px}
.top img{width:44px;height:44px;border-radius:50%;object-fit:cover;background:#fff;border:1.5px solid var(--line)}
.top h1{font:600 1.6rem/1.1 var(--serif);margin:0}
.top p{margin:0;color:var(--muted);font-size:.9rem}
.bell{margin-left:auto;position:relative;width:44px;height:44px;border-radius:50%;border:1px solid var(--line);background:var(--paper);display:grid;place-items:center;cursor:pointer}
.bell i{position:absolute;top:6px;right:6px;min-width:18px;height:18px;border-radius:9px;background:var(--rose);color:var(--rose-ink);font:600 .7rem/18px var(--sans);font-style:normal;text-align:center;padding:0 4px}
.sum{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:16px 0 18px}
.sum div{background:var(--paper);border:1px solid var(--line);border-radius:18px;padding:14px}
.sum b{display:block;font:600 1.7rem/1.1 var(--serif)}
.sum span{font-size:.82rem;color:var(--muted)}
.sum .hot{background:var(--wine);border-color:var(--wine);color:#FBE6EA}
.sum .hot span{color:#F2C6D0}
.tabs{display:flex;gap:4px;background:var(--paper);border:1px solid var(--line);border-radius:999px;padding:4px;position:sticky;top:calc(env(safe-area-inset-top,0px) + 8px);z-index:5}
.tabs button{flex:1;border:0;background:transparent;padding:10px 6px;border-radius:999px;font-weight:500;cursor:pointer;color:var(--muted)}
.tabs button[aria-selected="true"]{background:var(--wine);color:#FFF4F2}
.filters{display:flex;gap:6px;margin:16px 0 4px;overflow-x:auto}
.filters button{border:1.5px solid var(--line);background:transparent;border-radius:999px;padding:6px 14px;font-size:.88rem;cursor:pointer;white-space:nowrap}
.filters button[aria-pressed="true"]{border-color:var(--ink);background:var(--ink);color:var(--bg)}
.day{margin-top:22px}
.day h2{font:600 1.25rem var(--serif);margin:0 0 10px;display:flex;justify-content:space-between;align-items:baseline}
.day h2 small{font:400 .85rem var(--sans);color:var(--muted)}
.order{background:var(--paper);border:1px solid var(--line);border-radius:20px;padding:14px 16px;margin-bottom:10px}
.order.new-in{animation:slidein .5s ease-out}
@keyframes slidein{from{transform:translateY(-12px);opacity:0}}
.oh{display:flex;align-items:center;gap:10px}
.oh b{font-weight:600;font-size:1.05rem}
.time{font-size:.88rem;color:var(--muted)}
.st{margin-left:auto;font-size:.78rem;font-weight:600;padding:4px 10px;border-radius:999px}
.st.ny{background:var(--new-bg);color:var(--rose)}
.st.bekreftet{background:var(--ok-bg);color:var(--ok)}
.st.hentet{background:var(--done-bg);color:var(--muted)}
.order.is-hentet{opacity:.6}
.lines{display:flex;flex-wrap:wrap;gap:6px;margin:10px 0 0}
.lines span{display:inline-flex;align-items:center;gap:6px;background:var(--bg);border-radius:999px;padding:3px 10px 3px 3px;font-size:.88rem}
.lines img{width:24px;height:24px;border-radius:50%}
.meta{display:flex;flex-wrap:wrap;gap:4px 14px;margin-top:10px;font-size:.88rem;color:var(--muted)}
.meta a{color:var(--ink)}
.note{margin-top:8px;font-size:.9rem;background:var(--blush);border-radius:12px;padding:8px 12px}
.acts{display:flex;gap:8px;margin-top:12px}
.acts button{border:0;border-radius:999px;padding:9px 16px;font-weight:500;cursor:pointer}
.acts .pri{background:var(--rose);color:var(--rose-ink)}
.acts .sec{background:transparent;box-shadow:inset 0 0 0 1.5px var(--line)}
.empty{color:var(--muted);text-align:center;padding:30px 0}
.bake{background:var(--paper);border:1px solid var(--line);border-radius:20px;padding:16px;margin-top:14px}
.bake h2{font:600 1.25rem var(--serif);margin:0 0 4px;display:flex;justify-content:space-between;align-items:baseline}
.bake h2 small{font:600 .95rem var(--sans);color:var(--rose)}
.bake .sub{color:var(--muted);font-size:.85rem;margin:0 0 12px}
.row{display:grid;grid-template-columns:34px 1fr 40px;gap:10px;align-items:center;margin:8px 0}
.row img{width:34px;height:34px;border-radius:50%}
.row .bar{height:10px;border-radius:5px;background:var(--bg);overflow:hidden;margin-top:4px}
.row .bar i{display:block;height:100%;background:var(--rose);border-radius:5px}
.row b{text-align:right;font:600 1.15rem var(--serif)}
.row .nm{font-size:.95rem}
.panel{background:var(--paper);border:1px solid var(--line);border-radius:20px;padding:18px;margin-top:16px}
.panel h2{font:600 1.25rem var(--serif);margin:0 0 4px}
.panel p{color:var(--muted);font-size:.92rem;margin:0 0 14px}
.panel label{display:grid;gap:4px;font-weight:500;font-size:.9rem;margin-bottom:12px}
.panel input{font:inherit;color:var(--ink);background:var(--bg);border:1.5px solid var(--line);border-radius:12px;padding:10px 12px}
.panel .pri{border:0;border-radius:999px;padding:12px 20px;font-weight:500;background:var(--rose);color:var(--rose-ink);cursor:pointer}
.live{display:flex;gap:10px;align-items:center;background:var(--bg);border-radius:14px;padding:12px;font-size:.92rem;margin-bottom:14px}
.live .dot{width:10px;height:10px;border-radius:50%;background:var(--rose);box-shadow:0 0 0 5px var(--blush);flex:none}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translate(-50%,140%);background:var(--ink);color:var(--bg);padding:12px 18px;border-radius:16px;font-size:.92rem;max-width:calc(100% - 32px);box-shadow:0 14px 30px -10px rgba(0,0,0,.4);transition:transform .3s;z-index:30}
.toast.show{transform:translate(-50%,0)}
.push{position:fixed;left:50%;top:calc(12px + env(safe-area-inset-top,0px));transform:translate(-50%,-160%);width:min(420px,calc(100% - 24px));background:var(--paper);border:1px solid var(--line);border-radius:18px;padding:12px 14px;display:flex;gap:12px;align-items:center;box-shadow:0 20px 40px -14px rgba(0,0,0,.35);transition:transform .4s;z-index:40;cursor:pointer}
.push.show{transform:translate(-50%,0)}
.push img{width:38px;height:38px;border-radius:10px;background:#fff}
.push b{display:block;font-size:.92rem}
.push span{font-size:.86rem;color:var(--muted)}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>

const BUNS={"Oreo":"lotusmix","Lotus":"lotusoreo","Morroklumpen":"morro","Kinder og karamell":"karamell","Toppknuter":"toppknuter","Smash og karamell":"skaal","Kanelknuter":"kanel","Vaniljeknuter":"vanilje"};
const today=new Date();today.setHours(0,0,0,0);
const day=o=>{const d=new Date(today);d.setDate(d.getDate()+o);return d};
const fmt=d=>{const s=d.toLocaleDateString("nb-NO",{weekday:"long",day:"numeric",month:"long"});return s.charAt(0).toUpperCase()+s.slice(1)};
const rel=o=>o===0?"I dag":o===1?"I morgen":fmt(day(o)).split(" ")[0];
let orders=[
 {id:1,o:0,t:"17:00",n:"Emma R.",tel:"412 33 908",it:{"Lotus":15},c:"",s:"hentet"},
 {id:2,o:1,t:"12:00",n:"Ingrid H.",tel:"930 12 447",it:{"Oreo":6,"Lotus":6,"Kanelknuter":3},c:"Til lunsjen på jobben",s:"bekreftet"},
 {id:3,o:2,t:"11:00",n:"Martin S.",tel:"478 90 215",it:{"Morroklumpen":10,"Kinder og karamell":5,"Vaniljeknuter":5},c:"Bursdag til datteren 🎉",s:"ny"},
 {id:4,o:2,t:"14:00",n:"Sofie L.",tel:"951 07 336",it:{"Lotus":8,"Oreo":7},c:"",s:"ny"},
 {id:5,o:2,t:"16:30",n:"Jonas B.",tel:"404 55 120",it:{"Kanelknuter":10,"Vaniljeknuter":10,"Toppknuter":10},c:"Til kontoret. Kan jeg få kvittering?",s:"bekreftet"},
 {id:6,o:3,t:"13:00",n:"Hanne K.",tel:"917 44 802",it:{"Smash og karamell":5,"Kinder og karamell":5,"Oreo":5},c:"Nøtteallergi i familien. Kan Kinder byttes med noe annet?",s:"ny"},
 {id:7,o:6,t:"10:00",n:"Håndballaget (kampdag)",tel:"482 61 950",it:{"Kanelknuter":20,"Oreo":10,"Lotus":10},c:"Henter rett før kampstart",s:"bekreftet"}];
const incoming={id:8,o:3,t:"10:00",n:"Thea M.",tel:"466 18 073",it:{"Morroklumpen":8,"Toppknuter":7},c:"Første gang jeg bestiller!",s:"ny",fresh:true};
let filter="aktive";
const $=id=>document.getElementById(id);
const cnt=o=>Object.values(o.it).reduce((a,b)=>a+b,0);
function toast(m){const t=$("toast");t.textContent=m;t.classList.add("show");clearTimeout(t._h);t._h=setTimeout(()=>t.classList.remove("show"),2800)}
function card(o){
  const lines=Object.entries(o.it).map(([k,v])=>`<span><img src="${T[BUNS[k]]}" alt="">${v} ${k}</span>`).join("");
  const lbl={ny:"Venter på svar",bekreftet:"Bekreftet",hentet:"Hentet"}[o.s];
  const act=o.s==="ny"?`<button class="pri" data-a="confirm" data-id="${o.id}">Bekreft og send SMS</button><button class="sec" data-a="msg" data-id="${o.id}">Svar</button>`
   :o.s==="bekreftet"?`<button class="pri" data-a="picked" data-id="${o.id}">Merk som hentet</button>`
   :`<button class="sec" data-a="undo" data-id="${o.id}">Angre</button>`;
  return `<article class="order is-${o.s}${o.fresh?" new-in":""}"><div class="oh"><b>${o.n}</b><span class="time">kl. ${o.t}</span><span class="st ${o.s}">${lbl}</span></div>
  <div class="lines">${lines}</div>
  <div class="meta"><span>${cnt(o)} boller</span><a href="tel:${o.tel.replace(/ /g,"")}">${o.tel}</a></div>
  ${o.c?`<div class="note">${o.c}</div>`:""}<div class="acts">${act}</div></article>`;
}
function render(){
  const act=orders.filter(o=>o.s!=="hentet");
  const nNew=orders.filter(o=>o.s==="ny").length;
  $("sNew").textContent=nNew;$("bellN").textContent=nNew;$("bellN").hidden=!nNew;
  $("sWeek").textContent=act.filter(o=>o.o<=7).reduce((a,o)=>a+cnt(o),0);
  const nx=act.slice().sort((a,b)=>a.o-b.o||a.t.localeCompare(b.t))[0];
  $("sNext").textContent=nx?nx.t:"–";$("sNextL").textContent=nx?rel(nx.o)+", "+nx.n.split(" ")[0]:"Ingen hentinger";
  const shown=orders.filter(o=>filter==="aktive"?o.s!=="hentet":o.s===filter);
  const days=[...new Set(shown.map(o=>o.o))].sort((a,b)=>a-b);
  $("list").innerHTML=days.length?days.map(d=>{const os=shown.filter(o=>o.o===d).sort((a,b)=>a.t.localeCompare(b.t));
    return `<div class="day"><h2>${rel(d)===fmt(day(d)).split(" ")[0]?fmt(day(d)):rel(d)+" <small style='font:inherit;font-size:.8em;color:var(--muted)'>"+fmt(day(d)).replace(/^\S+ /,"")+"</small>"}<small>${os.reduce((a,o)=>a+cnt(o),0)} boller</small></h2>${os.map(card).join("")}</div>`}).join(""):`<p class="empty">Ingen bestillinger her.</p>`;
  orders.forEach(o=>delete o.fresh);
  // bakeliste
  const bd=[...new Set(act.map(o=>o.o))].sort((a,b)=>a-b);
  $("v-bake").innerHTML=bd.map(d=>{const sum={};act.filter(o=>o.o===d).forEach(o=>Object.entries(o.it).forEach(([k,v])=>sum[k]=(sum[k]||0)+v));
    const rows=Object.entries(sum).sort((a,b)=>b[1]-a[1]);const max=rows[0][1],tot=rows.reduce((a,r)=>a+r[1],0);
    const nOrd=act.filter(o=>o.o===d).length;
    return `<div class="bake"><h2>${rel(d)}<small>${tot} boller</small></h2><p class="sub">${fmt(day(d))}. ${nOrd} ${nOrd===1?"bestilling":"bestillinger"}.</p>${rows.map(([k,v])=>`<div class="row"><img src="${T[BUNS[k]]}" alt=""><div><div class="nm">${k}</div><div class="bar"><i style="width:${v/max*100}%"></i></div></div><b>${v}</b></div>`).join("")}</div>`}).join("");
}
$("list").addEventListener("click",e=>{const b=e.target.closest("[data-a]");if(!b)return;const o=orders.find(x=>x.id==b.dataset.id);const f=o.n.split(" ")[0];
  if(b.dataset.a==="confirm"){o.s="bekreftet";toast(`Bekreftelse sendt på SMS til ${f}`)}
  else if(b.dataset.a==="picked"){o.s="hentet";toast(`${f} har hentet. Fint!`)}
  else if(b.dataset.a==="undo"){o.s="bekreftet";toast("Angret")}
  else if(b.dataset.a==="msg"){toast(`Her kan du skrive en SMS til ${f}`)}
  render();});
$("filters").addEventListener("click",e=>{const b=e.target.closest("button");if(!b)return;filter=b.dataset.f;
  [...$("filters").children].forEach(x=>x.setAttribute("aria-pressed",x===b));render();});
document.querySelector(".tabs").addEventListener("click",e=>{const b=e.target.closest("button");if(!b)return;
  document.querySelectorAll(".tabs button").forEach(x=>x.setAttribute("aria-selected",x===b));
  ["orders","bake","dropin"].forEach(v=>$("v-"+v).hidden=v!==b.dataset.tab);});
$("bell").addEventListener("click",()=>{document.querySelector('[data-tab="orders"]').click();$("filters").children[1].click();});
// drop-in
const dd=day(1);$("dDag").value=fmt(dd);
const setLive=()=>$("liveTxt").textContent=`${$("dDag").value.toLowerCase()} fra kl. ${$("dTid").value}`;setLive();
$("dSave").addEventListener("click",()=>{setLive();toast("Nettsiden er oppdatert")});
// simulert ny bestilling
setTimeout(()=>{orders.push(incoming);render();
  $("pushT").textContent="Ny bestilling fra Thea M.";$("pushS").textContent=`${cnt(incoming)} boller, ${rel(incoming.o).toLowerCase()} kl. ${incoming.t}`;
  const p=$("push");p.classList.add("show");setTimeout(()=>p.classList.remove("show"),5000);
  p.onclick=()=>{p.classList.remove("show");$("bell").click()};},6000);
render();
</script>
